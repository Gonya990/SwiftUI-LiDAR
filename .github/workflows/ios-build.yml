name: iOS Build

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for a physical iOS device
        run: |
          set -o pipefail
          xcodebuild +            -project "Lidar Scan.xcodeproj" +            -scheme "Lidar Scan" +            -destination "generic/platform=iOS" +            CODE_SIGNING_ALLOWED=NO +            build | tee ios-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
